<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG image source（設計原檔，不對外索引）</title>
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #8a6d3b;
    font-family: "Noto Sans CJK TC", "PingFang TC", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center;
  }
  .wordmark {
    font-family: "Noto Serif CJK TC", Georgia, serif;
    font-size: 132px; font-weight: 700; letter-spacing: 0.16em; line-height: 1;
    margin: 0 0 28px; padding-left: 0.16em;
  }
  .rule { width: 140px; height: 2px; background: rgba(255,255,255,0.55); margin-bottom: 30px; }
  .tagline { font-size: 42px; letter-spacing: 0.32em; margin: 0 0 26px; padding-left: 0.32em; font-weight: 500; }
  .slogan { font-size: 26px; letter-spacing: 0.12em; color: #f7f3ec; margin: 0; }
  .domain {
    position: absolute; right: 44px; bottom: 36px;
    font-size: 21px; letter-spacing: 0.22em; color: rgba(255,255,255,0.75);
  }
  .dotrow { position: absolute; left: 44px; bottom: 42px; display: flex; gap: 10px; }
  .dotrow span { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.6); }
</style>
</head>
<body>
  <div class="wordmark">IROA</div>
  <div class="rule"></div>
  <div class="tagline">人機協作四維框架</div>
  <p class="slogan">「AI 能回答一切，但原點由你開始。」</p>
  <div class="dotrow"><span></span><span></span><span></span><span></span></div>
  <div class="domain">IROA.DEV</div>
</body>
</html>
